[project]
name = "hanarr"
version = "0.1.0"
description = "A configurable, self-hosted job-search agent: parses your resume, searches ToS-friendly job sources, scores fit against your preferences, tracks applications, and generates reminders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "apscheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "plyer>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "respx>=0.21"]
desktop = ["pywebview>=5.0"]
packaging = ["pyinstaller>=6.0", "pywebview>=5.0"]

[project.scripts]
hanarr = "hanarr.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
