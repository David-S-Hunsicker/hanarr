# Copy this file to config.yaml and edit it. config.yaml is gitignored —
# your preferences and resume path never get committed.

profile:
  name: "Your Name"
  resume_path: "resumes/resume.md"   # .md, .txt, or .pdf

preferences:
  # What you're looking for. Free-text titles/keywords the matcher will
  # weigh alongside your resume when scoring postings.
  target_titles:
    - "Software Engineer"
    - "Backend Engineer"
  keywords_boost:       # bonus weight if present in a posting
    - "python"
    - "distributed systems"
  keywords_exclude:     # postings containing these are filtered out entirely
    - "unpaid"
    - "commission only"

  seniority:              # any of: intern, junior, mid, senior, staff, principal, exec
    - "mid"
  employment_types:       # any of: full_time, part_time, contract, internship
    - "full_time"

  locations:
    - "Remote"
    - "Seattle, WA"
  remote_ok: true
  onsite_ok: false
  willing_to_relocate: false
  # Even a "remote" posting can be scoped to one country (e.g. "Remote -
  # Canada"); postings that clearly restrict to another country are
  # filtered out. Leave blank ("") to disable this check.
  work_country: "United States"

  salary_floor_usd: 120000   # postings below this (when salary is listed) are filtered
  company_size_min: null      # e.g. 50 — leave null to not filter
  company_size_max: null

  industries_include: []      # empty = no restriction
  industries_exclude:
    - "gambling"
    - "tobacco"

  dealbreakers:                # free text, considered by the LLM scorer
    - "no visa sponsorship available"

matching:
  min_fit_score: 60    # 0-100; postings scoring below this are hidden by default

sources:
  greenhouse:
    enabled: true
    # Company board tokens, e.g. for boards.greenhouse.io/stripe -> "stripe".
    # This list is only two companies by default, which is the single
    # biggest reason a fresh install sees few postings -- it's not that the
    # connector or matching logic is broken, it's that only two employers
    # are actually being asked. The names below are all live and verified
    # (each one checked directly against boards-api.greenhouse.io before
    # being added here); add or remove company tokens freely, and verify a
    # new one the same way: a 200 from
    # https://boards-api.greenhouse.io/v1/boards/<token>/jobs means it's
    # real, a 404 means the token is wrong or that company doesn't use
    # Greenhouse's public board.
    company_boards:
      - "stripe"
      - "airbnb"
      - "robinhood"
      - "coinbase"
      - "discord"
      - "reddit"
      - "pinterest"
      - "figma"
      - "asana"
      - "cloudflare"
      - "databricks"
      - "anthropic"
      - "scaleai"
      - "affirm"
      - "instacart"
      - "lyft"
      - "gitlab"
      - "elastic"
      - "mongodb"
      - "twilio"
      - "datadog"
      - "gusto"
      - "brex"
      - "chime"
      - "samsara"
      - "webflow"
      - "vercel"
      - "carta"
      - "squarespace"
      - "amplitude"
      - "mixpanel"
      - "checkr"
      - "roblox"
      - "block"
      - "airtable"
      - "dropbox"
      - "janestreet"
      - "okta"
      - "peloton"
      - "sofi"
      - "toast"
      - "twitch"
      - "coursera"
      - "doximity"
      - "faire"
      - "flexport"
      - "intercom"
      - "lattice"
      - "udemy"
      - "calendly"
      - "cribl"
      - "duolingo"
      - "pagerduty"
      - "salesloft"
      - "zoominfo"
      - "cockroachlabs"
      - "mercury"
      - "glossier"
      - "cameo"
      - "nextdoor"
      - "attentive"
      - "braze"
      - "klaviyo"
      - "pendo"
      - "remote"
      - "justworks"
      - "oura"
  lever:
    enabled: true
    # Company slugs, e.g. for jobs.lever.co/netflix -> "netflix". Off by
    # default upstream, but there's no reason to leave a whole working
    # connector unused -- verified live the same way as the Greenhouse list
    # above (a 200 from https://api.lever.co/v0/postings/<slug>?mode=json).
    # Lever has fewer large public users than Greenhouse these days (several
    # well-known companies that used to be on Lever have since moved off
    # it), so this list is shorter -- that's real coverage, not a shortcut.
    companies:
      - "palantir"
      - "ro"
      - "clari"
      - "voleon"
      - "alloy"
      - "imbue"
      - "tovala"
      - "aircall"
      - "aledade"
      - "spotify"
      - "immutable"
      - "moonpay"
      - "anchorage"
  ashby:
    enabled: true
    # Company slugs, e.g. for jobs.ashbyhq.com/ramp -> "ramp". Verified live
    # the same way as the lists above (a 200 from
    # https://api.ashbyhq.com/posting-api/job-board/<slug>). Ashby is
    # popular with AI-native and recent-generation startups in particular.
    company_boards:
      - "ramp"
      - "notion"
      - "linear"
      - "replit"
      - "openai"
      - "mercor"
      - "cursor"
      - "perplexity"
      - "pika"
      - "runway"
      - "elevenlabs"
      - "character"
      - "suno"
      - "drata"
      - "secureframe"
      - "watershed"
      - "sardine"
      - "unit"
      - "column"
      - "dave"
      - "zip"
  remoteok:
    enabled: true
    # RemoteOK's own tag taxonomy, sampled live from its API rather than
    # guessed -- "machine-learning" isn't an actual tag in use there, but
    # "ai", "cloud", and "python"/"backend" are. Tags are OR'd together (any
    # one match is enough), so adding more only widens results, never
    # narrows them.
    tags: ["python", "backend", "ai", "cloud"]
  arbeitnow:
    enabled: true
  workday:
    enabled: false
    # No shipped defaults here (unlike the sources above) -- Workday has no
    # public directory of tenants, so there's nothing to sample live the
    # way the other lists were. Add a company's own public Workday careers
    # URL, e.g.:
    #   career_site_urls:
    #     - "https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite"
    # This hits Workday's public but undocumented job feed (see
    # connectors/workday.py) -- slower per company than the sources above
    # since a second request per job is needed just to get a description,
    # and less durable since Workday hasn't committed to keeping this
    # endpoint's shape stable the way Greenhouse/Lever/Ashby have.
    career_site_urls: []
  recruitee:
    enabled: true
    # Company slugs, e.g. for vandebron.recruitee.com -> "vandebron".
    # Verified live the same way as the lists above (a non-empty `offers`
    # array from https://<slug>.recruitee.com/api/offers/). Recruitee skews
    # European and toward small/mid-size employers rather than the
    # funded-startup skew of the Greenhouse/Lever/Ashby lists above, so this
    # genuinely reaches a different slice of employers, not just more of
    # the same.
    company_boards:
      - "vandebron"
      - "duravermeer"
      - "myjewellery"
      - "dckgroup"
      - "bunq"
      - "vanmossel"
      - "channable"
      - "keolis"
      - "pretamanger"
      - "boulangerieange"
      - "ballastnedam"
      - "vionfoodgroup"
      - "sirclecollection"
      - "bettercollective"
      - "dpd"
      - "cmcom"
      - "livestorm"
      - "greenpeacecee"
  workable:
    enabled: false
    # No company list here (unlike the sources above) -- most individual
    # Workable accounts return zero current postings even for well-known
    # names, since Workable has no stable public directory of slugs to
    # verify against the way Greenhouse/Lever/Ashby/Recruitee do. Instead
    # this searches Workable's own public cross-employer job search by
    # keyword (the same thing typing into jobs.workable.com's search box
    # does) -- add your target titles/keywords, e.g.:
    #   queries:
    #     - "software engineer"
    #     - "data analyst"
    queries: []
  usajobs:
    enabled: false
    # The official US federal government jobs API -- reaches federal/public
    # sector postings none of the sources above touch at all. Requires a
    # free API key, one per registered email, requested at
    # https://developer.usajobs.gov/apirequest -- there's no anonymous
    # access the way the sources above allow. Settings -> Preferences has a
    # "USAJOBS" section that stores the key in your OS credential store,
    # never here in config.yaml.
    user_agent_email: ""
    queries: []
  # The default company_boards/companies lists above skew heavily toward
  # tech/startup companies. When true, a search only queries default-list
  # companies whose known hiring mix overlaps the candidate's own resume
  # (extracted titles/skills/industries) or target_titles preference --
  # e.g. an accounting/payroll search skips companies known to hire almost
  # entirely engineers, so real matches aren't buried under hundreds of
  # engineering postings. Companies you add yourself are never filtered by
  # this, only the shipped defaults are. Set to false to always query every
  # configured board regardless of profile.
  filter_boards_by_profile: true

llm:
  provider: "ollama"          # ollama | anthropic (bring your own key) | none (rule-based only)
  model: "qwen2.5:14b"
  base_url: "http://localhost:11434"
  timeout_seconds: 1800       # seconds to wait for LLM response (increase for slower models like deepseek-r1)
  num_ctx: 8192               # Ollama only -- the model's context window in tokens. Left too low,
                              # Ollama silently truncates long prompts (a full resume + job posting),
                              # which can drop the system prompt or input entirely and produce a
                              # degenerate response. Lower this only if the model won't fit in VRAM
                              # at this size; raise it for a very large resume/posting pair.
  # api_key: set via ANTHROPIC_API_KEY env var if provider = anthropic

# Specialized agents inherit llm above unless overridden. Task overrides take
# precedence over the named agent, then agents.default, then llm. Keep
# Anthropic opt-in and put its key in .env, never in this file.
agents:
  profiler: {}          # resume/profile extraction
  market_analysis: {}   # job matching and skill-gap analysis
  curriculum: {}        # coaching project planning
  evaluator: {}         # submitted project evaluation
  resume_writer: {}     # reviewable resume proposals
  # Example per-agent override:
  # evaluator:
  #   provider: anthropic
  #   model: claude-3-5-sonnet-latest
  # Example named-task override:
  # tasks:
  #   interview_prep:
  #     provider: ollama
  #     model: qwen2.5:7b

schedule:
  search_interval_hours: 6
  reminder_check_interval_hours: 1

reminders:
  follow_up_after_days: 7       # remind to follow up N days after marking "applied"
  desktop_notifications: true
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    # smtp_password: set via SMTP_PASSWORD env var
    to_address: ""

dashboard:
  host: "127.0.0.1"
  port: 8420
  # none preserves foreground server behavior; browser opens your default
  # browser; webview uses the optional desktop dependency.
  launch_mode: "none"

updates:
  enabled: false
  # Optional JSON endpoint with version, release_notes_url, notes, and
  # checksum-validated assets. Leave blank to use GitHub releases instead.
  endpoint: ""
  github_repository: ""
  timeout_seconds: 10
