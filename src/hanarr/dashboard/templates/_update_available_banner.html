<div id="update-available-banner" hidden
     style="align-items:center; flex-wrap:wrap; gap:.5rem; background:#fff8e6; color:#5a4300; border:1px solid #b5790f; border-radius:999px; padding:.35rem .8rem; font-size:.82rem; margin:0 0 1rem;">
  <span id="update-available-text"></span>
  <span id="update-progress-track" hidden style="display:inline-block; width:90px; height:6px; border-radius:3px; background:#f0d9a0; overflow:hidden; vertical-align:middle;">
    <span id="update-progress-fill" style="display:block; width:40%; height:100%; background:#b5790f; animation:update-progress-sweep 1.1s ease-in-out infinite;"></span>
  </span>
  <button type="button" id="update-install-now-btn"
          style="font:inherit; border:1px solid #b5790f; border-radius:6px; padding:.15rem .5rem; background:#fff; color:#5a4300; cursor:pointer;">Update now</button>
  <button type="button" id="update-cancel-btn"
          style="font:inherit; border:1px solid #b5790f; border-radius:6px; padding:.15rem .5rem; background:#fff; color:#5a4300; cursor:pointer;">Cancel</button>
</div>
<style>
  @keyframes update-progress-sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
</style>
<script>
  (function () {
    var banner = document.getElementById("update-available-banner");
    var text = document.getElementById("update-available-text");
    var progressTrack = document.getElementById("update-progress-track");
    var installBtn = document.getElementById("update-install-now-btn");
    var cancelBtn = document.getElementById("update-cancel-btn");
    if (!banner) return;

    // `hidden` toggles the attribute, but this element also needs an
    // explicit visible `display` when shown -- a bare `hidden` attribute
    // with no inline `display` falls back to the browser default (`block`
    // for a div), which breaks the inline pill layout, so both are set
    // together everywhere this banner's visibility changes.
    function setVisible(visible) {
      banner.hidden = !visible;
      banner.style.display = visible ? "inline-flex" : "none";
    }

    function render(data) {
      if (!data.available || data.cancelled) {
        setVisible(false);
        return;
      }
      setVisible(true);
      if (data.applying) {
        text.textContent = "Installing Hanarr " + data.version + "… the app will restart shortly.";
        progressTrack.hidden = false;
        installBtn.hidden = true;
        cancelBtn.hidden = true;
        return;
      }
      progressTrack.hidden = true;
      installBtn.hidden = false;
      cancelBtn.hidden = false;
      var remaining = data.apply_at ? Math.max(0, Math.round(data.apply_at - (Date.now() / 1000))) : null;
      if (remaining === null) {
        text.textContent = "Hanarr " + data.version + " is ready to install.";
      } else if (remaining <= 0) {
        text.textContent = "Hanarr " + data.version + " is ready — installing now…";
      } else {
        text.textContent = "Hanarr " + data.version + " is ready — installing in " + remaining + "s.";
      }
      if (data.error) {
        text.textContent += " (" + data.error + ")";
      }
    }

    function poll() {
      fetch("/update/status").then(function (r) { return r.json(); }).then(render).catch(function () {});
    }

    installBtn.addEventListener("click", function () {
      installBtn.disabled = true;
      cancelBtn.hidden = true;
      // The install request blocks until the download, checksum
      // verification, and installer launch all finish (easily tens of
      // seconds) -- show progress immediately rather than leaving the
      // button looking stuck until the response finally arrives.
      text.textContent = "Downloading and verifying the update…";
      progressTrack.hidden = false;
      fetch("/config/update/install", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "consent=true",
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (data.status === "error") {
          window.alert(data.message || "Could not install the update.");
          installBtn.disabled = false;
          cancelBtn.hidden = false;
          progressTrack.hidden = true;
          poll();
        } else {
          poll();
        }
      }).catch(function () {
        installBtn.disabled = false;
        cancelBtn.hidden = false;
        progressTrack.hidden = true;
      });
    });

    cancelBtn.addEventListener("click", function () {
      fetch("/update/cancel", { method: "POST" }).then(poll).catch(function () {});
      window.alert('Update cancelled. You can install it anytime from Settings → Updates → "Update now".');
    });

    poll();
    setInterval(poll, 5000);
  })();
</script>
