<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{ section }} · Hanarr</title>
<style>
:root { color-scheme: light; --page:#f9f9f7; --surface:#fff; --text:#0b0b0b; --muted:#625f59; --border:rgba(11,11,11,.14); --accent:#1765ad; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --text:#fff; --muted:#c3c2b7; --border:rgba(255,255,255,.16); --accent:#67aaf0; } }
* { box-sizing: border-box; }
body { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; background: var(--page); color: var(--text); font-family: system-ui, sans-serif; }
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1rem 0 2rem; }
.tabs a { color: var(--muted); padding: .45rem .9rem; text-decoration: none; font-size: .85rem; font-weight: 600; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); transition: background .12s ease, color .12s ease, border-color .12s ease; }
.tabs a:hover { border-color: var(--accent); color: var(--accent); }
.tabs a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.card { padding: 1.2rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.card a { color: var(--accent); }
</style></head>
<body><h1>{{ section }}</h1>
<nav class="tabs" aria-label="Main navigation"><a href="/">Jobs</a><a href="/coaching">Coaching</a><a href="/resume">Resume</a><a href="/skills">Skills</a><a class="active" href="/{{ section|lower }}">{{ section }}</a><a href="/config">Settings</a></nav>
<div class="card"><p>This Hanarr surface is reserved for the next transition milestone.</p><p><a href="/coaching">View coaching projects</a> or <a href="/">return to Jobs</a>.</p></div>
</body></html>
